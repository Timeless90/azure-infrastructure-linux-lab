name: Course validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r examples/fastapi/requirements.txt -r tests/requirements.txt
      - name: Validate course and Python behavior
        run: python scripts/validate.py
      - name: ShellCheck
        run: shellcheck -x scripts/*.sh
      - name: Compile and lint Bicep locally, no Azure login
        run: |
          curl --fail --location --retry 2 -o /tmp/course-bicep https://github.com/Azure/bicep/releases/download/v0.34.44/bicep-linux-x64
          chmod +x /tmp/course-bicep
          mkdir -p .state
          for template in infra/bicep/*.bicep; do
            /tmp/course-bicep build "$template" --outfile ".state/$(basename "$template" .bicep).json"
          done
